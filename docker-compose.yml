# Host ports are deliberately non-default: this machine already runs Postgres
# on 5432 and 5438, Airflow on 8080, and Superset on 8088. Nothing here binds
# a port another app is using. Override any of them in .env.
#
# In production every one of these binds to loopback instead, so only the
# reverse proxy is exposed — see DEPLOY.md and deploy/docker-compose.prod.yml.
#
#   web  -> http://localhost:${WEB_PORT:-8090}
#   api  -> http://localhost:${API_PORT:-8010}/api/docs
#   db   -> localhost:${DB_PORT:-5440}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-premierpower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-premierpower}
      POSTGRES_DB: ${POSTGRES_DB:-premierpower}
    ports:
      - "${DB_BIND:-}${DB_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-premierpower} -d ${POSTGRES_DB:-premierpower}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-premierpower}:${POSTGRES_PASSWORD:-premierpower}@db:5432/${POSTGRES_DB:-premierpower}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@premierpower.co.ke}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      # nginx proxies the browser's /api to this service, so requests are
      # same-origin and this list only matters for direct API access.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      # Optional: when unset, uploads are stored on the volume above.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # Off by default: Cloudinary blocks PDF delivery at the account level
      # until "Allow delivery of PDF and ZIP files" is enabled in its console.
      # ':-false' matters: an unset variable expands to "", which pydantic
      # cannot read as a boolean and which stops the API booting at all.
      CLOUDINARY_DOCUMENTS: ${CLOUDINARY_DOCUMENTS:-false}
    ports:
      - "${API_BIND:-}${API_PORT:-8010}:8000"
    volumes:
      # Locally stored photographs must survive a container rebuild.
      - uploads:/app/uploads
      # Enquiry attachments when Cloudinary is not set; never served publicly.
      - private:/app/private
    # Without this, nginx starts proxying before uvicorn is serving and the
    # first requests come back 502.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)\""]
      # Generous: the probe starts a Python interpreter, which can exceed a
      # tight budget while other images are building on the same machine.
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        VITE_DEMO: ${VITE_DEMO:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-}${WEB_PORT:-8090}:80"

volumes:
  pgdata:
  uploads:
  private:
