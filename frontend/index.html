<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PremierPower — Licensed residential wiring &amp; rewiring in Nairobi</title>

    <!--
      LocalBusiness JSON-LD. @type Electrician is a recognised LocalBusiness
      subtype and is the more specific signal for this vertical.
      TODO(launch): replace every PENDING value with the client's real NAP.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Electrician",
      "name": "PremierPower",
      "description": "EPRA-licensed residential electrical wiring and rewiring in Nairobi, Kenya.",
      "url": "https://premierpower.co.ke/",
      "telephone": "PENDING",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "PENDING",
        "addressLocality": "Nairobi",
        "addressRegion": "Nairobi County",
        "addressCountry": "KE"
      },
      "areaServed": { "@type": "City", "name": "Nairobi" },
      "priceRange": "PENDING",
      "knowsAbout": [
        "Residential rewiring",
        "Consumer unit upgrades",
        "Electrical inspection and certification"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
