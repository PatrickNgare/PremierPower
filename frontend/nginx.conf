server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths fall through to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ^~ so this wins over the regex asset rule below. Without it, every
    # uploaded photograph 404s: the regex matched .jpg/.png first and looked
    # for the file in nginx's own root instead of proxying to the API.
    location ^~ /uploads/ {
        proxy_pass http://api:8000/uploads/;
        proxy_set_header Host $host;
        # Uploaded files are user content: never let a browser re-interpret
        # the type, and never let them render as a top-level document.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        expires 30d;
        add_header Cache-Control "public" always;
    }

    # Asset-shaped paths must 404 rather than fall through to index.html.
    # Returning HTML with a 200 for a missing image means the <img> onError
    # handler never fires, so the honest "photograph required" placeholder is
    # replaced by a broken image the browser still tries to decode.
    location ~* \.(png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm|pdf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Same-origin API, so the browser never needs CORS and no host URL is
    # compiled into the bundle.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin is the CMS, which is part of the SPA and falls through to
    # index.html via `location /` above. Only the raw sqladmin table view is
    # proxied to the backend, and only for developer use.
    location /sqladmin {
        proxy_pass http://api:8000/sqladmin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed assets are immutable; index.html must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Baseline security headers. None were set before.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
