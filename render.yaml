# Render Blueprint: the API and its Postgres database.
#
# Render dashboard → New → Blueprint → pick this repository. It reads this
# file, creates both, and asks for every value marked `sync: false`.
#
# The frontend is not here: it lives on Vercel (frontend/vercel.json), which
# forwards /api, /uploads, /sitemap.xml and /robots.txt to this service.

services:
  - type: web
    name: premierpower-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Frankfurt is the closest Render region to Kenya.
    region: frankfurt
    # Free: sleeps after 15 minutes idle, and the next visitor waits about a
    # minute while it wakes. Change to starter ($7/month) to keep it awake.
    plan: free
    healthCheckPath: /api/health
    # Frontend-only commits should not rebuild the API.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: premierpower-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

      # The first admin, created on first start if none exists.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # The Vercel address, e.g. https://premierpower.vercel.app. Requests
      # arrive same-origin through Vercel's rewrites, so this only matters if
      # something calls the Render URL directly.
      - key: CORS_ORIGINS
        sync: false

      # Required on Render. Its disk is wiped on every deploy and restart, so
      # without Cloudinary every photograph uploaded through the CMS vanishes.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # PDFs (certificates, datasheets) go to local disk by default, which on
      # Render means they are lost too. Turn on "Allow delivery of PDF and ZIP
      # files" in Cloudinary → Settings → Security, then leave this true.
      - key: CLOUDINARY_DOCUMENTS
        value: "true"

      # Optional. Vercel → premier-power → Settings → Git → Deploy Hooks →
      # create one for "master" and paste its URL here. The site then rebuilds
      # itself a few minutes after content edits, so a new service, product or
      # article gets its own search title and link preview without a manual
      # redeploy. Leave blank to skip.
      - key: VERCEL_DEPLOY_HOOK
        sync: false

      # Enquiry emails. Leave blank to skip: enquiries still save to the CMS.
      - key: NOTIFY_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: premierpower-db
    databaseName: premierpower
    user: premierpower
    region: frankfurt
    # Paid (about $6/month): free Postgres is deleted 30 days after creation,
    # CMS content and all. Paid plans also get Render's point-in-time recovery.
    plan: basic-256mb
    postgresMajorVersion: "16"
